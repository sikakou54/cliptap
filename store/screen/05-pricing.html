<!doctype html>
<!--
  スライド 05 — 締めのポスター。
  lp.css の .close をそのまま持ち込んだ濃紺面。デッキ唯一の暗い領域。
  見出しは LP の closing（apps/web/index.html:370）、数字帯は stats（:200-）から逐語流用。
  リードは pricing（:333）に、定型文・ショートカットの Free 上限（定型文50件・ショートカット10件）を補ったもの。
-->
<meta charset="utf-8" />
<template id="slide">
  <div class="head">
    <h1 class="ja">
      <span class="line">今日から、同じ文章を</span>
      <span class="line accent">打つのをやめる。</span>
    </h1>
    <h1 class="en">
      <span class="line">Stop typing the same</span>
      <span class="line accent">text again today.</span>
    </h1>

    <p class="sub ja">定型文（50件まで）・ショートカット（10件まで）・カテゴリ・拡張キーボード・7変数と94書式は、すべて無料プランに含まれます。</p>
    <p class="sub en">Templates (up to 50), shortcuts (up to 10), categories, the keyboard, 7 variables and 94 formats are all included in the free plan.</p>
  </div>

  <div class="stage" data-shots="0">
    <div class="stats">
      <div class="stat">
        <p class="stat-num"><span class="ja">50件</span><span class="en">50</span></p>
        <p class="stat-label"><span class="ja">定型文を無料で登録</span><span class="en">Templates, saved for free</span></p>
      </div>
      <div class="stat">
        <p class="stat-num">7 + 94</p>
        <p class="stat-label"><span class="ja">システム変数7種と書式94種</span><span class="en">System variables and format presets</span></p>
      </div>
      <div class="stat">
        <p class="stat-num"><span class="ja">0円</span><span class="en">$0</span></p>
        <p class="stat-label"><span class="ja">基本機能はずっと無料</span><span class="en">The essentials stay free</span></p>
      </div>
      <div class="stat">
        <p class="stat-num"><span class="ja">端末内</span><span class="en">On device</span></p>
        <p class="stat-label"><span class="ja">データはクラウドに送らない</span><span class="en">Nothing goes to the cloud</span></p>
      </div>
    </div>
  </div>
</template>
