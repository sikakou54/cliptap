<!doctype html>
<!--
  スライド 01 — 拡張キーボード。
  docs/MARKETING_STRATEGY.md §4-5 の指示により、アイキャッチの次（実質1枚目の機能訴求）に置く。
  キャプチャは撮影用ホストのメッセージ面（store/screen/host/compose-message.html）で、
  相手とのやりとりの下に、これから入る定型文がキーボードのプレビューに出ている挿入の直前
  （00-hero の右と同じ画像）。挿入する定型文は日付を含まないものを選んでいる。
  {{today}} は撮影当日へ展開されるため、別の日に撮った他の面と日付が食い違うのを避けている。
  リードは LP の HOW IT WORKS ステップ2（apps/web/index.html:299-）から逐語。
  ヒーローのリードは 00-hero が使うため、ここでは重複させない。
-->
<meta charset="utf-8" />
<template id="slide">
  <div class="head">
    <h1 class="ja">
      <span class="line">アプリを切り替えずに、</span>
      <span class="line accent">いつもの文章が入る。</span>
    </h1>
    <h1 class="en">
      <span class="line">Your usual text,</span>
      <span class="line accent">without switching apps.</span>
    </h1>

    <p class="sub ja">他のアプリでClipTapキーボードに切り替えて、定型文をタップするだけです。</p>
    <p class="sub en">In any other app, switch to the ClipTap keyboard and tap the template.</p>

    <p class="note"></p>
  </div>

  <div class="stage" data-shots="1">
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/01-hero-right-insert-{{LANG}}.png" width="1206" height="2622" alt="" />
        </div>
      </div>
      <figcaption class="cap"></figcaption>
    </figure>
  </div>
</template>
