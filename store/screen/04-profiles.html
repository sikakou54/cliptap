<!doctype html>
<!--
  スライド 04 — カスタム変数とプロファイル。
  見出しとリードは LP の custom variables セクション（apps/web/index.html:290-）から逐語流用。
  左が設定、右が使う側。左はカスタム変数の編集画面で、プロファイルごとに値を持つ表が写る。
  右は {{client_name}} などのカスタム変数を本文に使った定型文の編集画面。
-->
<meta charset="utf-8" />
<template id="slide">
  <div class="head">
    <h1 class="ja">
      <span class="line">会社名や宛名も、</span>
      <span class="line accent">一度登録するだけ。</span>
    </h1>
    <h1 class="en">
      <span class="line">Names and companies,</span>
      <span class="line accent">registered once.</span>
    </h1>

    <p class="sub ja">会社名・担当者名・署名はカスタム変数に。プロファイルを切り替えれば別の相手向けになります。</p>
    <p class="sub en">Register company names, contacts and signatures. Switch the profile and it fits the next client.</p>

    <p class="note"></p>
  </div>

  <div class="stage" data-shots="2">
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/04-profile-left-edit.png" width="1170" height="2532" alt="" />
        </div>
      </div>
      <figcaption class="cap"></figcaption>
    </figure>
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/04-profile-right-snippet.png" width="1170" height="2532" alt="" />
        </div>
      </div>
      <figcaption class="cap"></figcaption>
    </figure>
  </div>
</template>
