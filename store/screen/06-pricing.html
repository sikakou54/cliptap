<!doctype html>
<!--
  スライド 06 — 締めのポスター。
  lp.css の .close をそのまま持ち込んだ濃紺面。デッキ唯一の暗い領域。
  見出しは LP の closing（#cta）、数字帯は stats（#top 直下）から逐語流用。
  en の2番目のラベルだけ LP の「Insert a template from your keyboard」（36字）を
  「Insert from your keyboard」（25字）へ縮めている。.stat-label は nowrap で
  ios65 の1列はマスター上で 543px、出荷できている最長ラベルが35字のため36字は入らない。
  リードは pricing（#pricing）に、定型文・ショートカットの Free 上限（定型文50件・ショートカット50件）を補ったもの。
-->
<meta charset="utf-8" />
<template id="slide">
  <div class="head">
    <h1 class="ja">
      <span class="line">次の返信から、</span>
      <span class="line accent">ワンタップで。</span>
    </h1>
    <h1 class="en">
      <span class="line">Make your next reply</span>
      <span class="line accent">a tap away.</span>
    </h1>

    <p class="sub ja">定型文（50件まで）・ショートカット（50件・値5件まで）・カテゴリ・拡張キーボード・7変数と94書式は、すべて無料プランに含まれます。</p>
    <p class="sub en">Templates (up to 50), shortcuts (up to 50, 5 values each), categories, the keyboard, 7 variables and 94 formats are all included in the free plan.</p>
  </div>

  <div class="stage" data-shots="0">
    <div class="stats">
      <div class="stat">
        <p class="stat-num"><span class="ja">50件</span><span class="en">50</span></p>
        <p class="stat-label"><span class="ja">定型文を無料で登録</span><span class="en">Templates, saved for free</span></p>
      </div>
      <div class="stat">
        <p class="stat-num"><span class="ja">どこでも</span><span class="en">Any app</span></p>
        <p class="stat-label"><span class="ja">キーボードから定型文を入力</span><span class="en">Insert from your keyboard</span></p>
      </div>
      <div class="stat">
        <p class="stat-num"><span class="ja">登録不要</span><span class="en">No sign-up</span></p>
        <p class="stat-label"><span class="ja">アカウントなしで使い始められる</span><span class="en">Start without creating an account</span></p>
      </div>
      <div class="stat">
        <p class="stat-num"><span class="ja">端末内</span><span class="en">On device</span></p>
        <p class="stat-label"><span class="ja">登録した文章をローカルに保存</span><span class="en">Your saved text stays local</span></p>
      </div>
    </div>
  </div>
</template>
