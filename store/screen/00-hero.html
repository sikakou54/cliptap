<!doctype html>
<!--
  スライド 00 — アイキャッチ。
  LP のヒーロー（apps/web/index.html の #top / en/index.html の #top）を持ち込む。
  見出しは逐語。リードは ja が逐語、en だけ末尾の「in your text field, and tap to
  insert it」を「and tap」へ縮めている（LP の原文は138字で4行に伸び、iPad 面の
  余白計算が hero 3行を前提にしているため）。端末も LP のヒーローと同じ2台組
  （左=ホーム一覧、右=キーボードから挿入する直前）で、重なり方も lp.css の .hero-shots に従う。
  左が「登録してある文章」、右が「そこから選んだ1件がこれから入るところ」という対になる。
  デッキの先頭に置くアイキャッチなので、見出しだけ他の面より大きく組む
  （lp.css の .hero h1 が .section-title より大きいのと同じ）。

  端末キャプチャはファイル名に -{{LANG}} を持ち、ja / en で中身が入れ替わる
  （日本語UIのキャプチャを英語面へ出さないため）。両言語ぶんが揃っていないと
  build.mjs の assertImagesExist で止まる。
-->
<meta charset="utf-8" />
<template id="slide">
  <div class="head">
    <h1 class="ja">
      <span class="line">いつもの文章を、</span>
      <span class="line accent">ワンタップで。</span>
    </h1>
    <h1 class="en">
      <span class="line">Your usual text,</span>
      <span class="line accent">one tap away.</span>
    </h1>

    <p class="sub ja">メールの返信、SNSのタグ、AIへの指示。よく使う文章を登録したら、使いたい入力欄でClipTapキーボードに切り替えてタップ。</p>
    <p class="sub en">Email replies, hashtags, AI prompts. Save the text you use often, switch to the ClipTap keyboard and tap.</p>
  </div>

  <div class="stage" data-shots="2">
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/01-hero-left-home-{{LANG}}.png" width="1206" height="2622" alt="" />
        </div>
      </div>
      <figcaption class="cap"></figcaption>
    </figure>
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/01-hero-right-insert-{{LANG}}.png" width="1206" height="2622" alt="" />
        </div>
      </div>
      <figcaption class="cap"></figcaption>
    </figure>
  </div>
</template>
